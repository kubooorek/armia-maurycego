<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMIA MAURYCEGO - Oficjalna Strona Klanu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --dark-bg: #0b0d10;
            --card-bg: #151820;
            --card-border: #232833;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-glow: rgba(245, 158, 11, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: var(--dark-bg); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        h1, h2, h3, .clan-title { font-family: 'Cinzel', serif; }
        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(11, 13, 16, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); z-index: 1000; display: flex; justifyContent: space-between; align-items: center; padding: 1rem 5%; }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 1.3rem; font-weight: 700; font-family: 'Cinzel', serif; color: var(--primary); text-decoration: none; letter-spacing: 1px; }
        nav ul { display: flex; list-style: none; gap: 2rem; }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.3s; }
        nav a:hover { color: var(--primary); }
        .discord-btn-nav { background-color: #5865F2; color: white; padding: 0.5rem 1.2rem; border-radius: 8px; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 1rem; background: radial-gradient(circle at center, rgba(245, 158, 11, 0.12) 0%, rgba(11, 13, 16, 1) 75%); }
        .hero h1 { font-size: 4rem; color: var(--text-main); margin-bottom: 1rem; }
        .hero h1 span { color: var(--primary); }
        .hero p { font-size: 1.2rem; color: var(--text-muted); max-width: 650px; margin-bottom: 2.5rem; }
        .btn { padding: 0.9rem 2.2rem; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
        .btn-primary { background-color: var(--primary); color: #000; }
        .btn-outline { border: 2px solid var(--card-border); color: var(--text-main); background: transparent; }
        section { padding: 6rem 8% 4rem 8%; border-bottom: 1px solid var(--card-border); }
        .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 1rem; }
        .section-title span { color: var(--primary); }
        .section-desc { text-align: center; color: var(--text-muted); max-width: 600px; margin: 0 auto 3.5rem auto; }
        .stats-grid, .features-grid, .grid-2, .team-grid { display: grid; gap: 2rem; }
        .stat-card, .feature-box, .card, .team-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 2rem; }
        footer { background: #07090b; padding: 3rem 8%; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo"><i class="fa-solid fa-shield-halved"></i> ARMIA MAURYCEGO</a>
        <nav>
            <ul>
                <li><a href="#home">Start</a></li>
                <li><a href="#modes">Aktywności</a></li>
                <li><a href="#rules">Zasady</a></li>
                <li><a href="#about">O nas</a></li>
            </ul>
        </nav>
        <a href="https://discord.gg/twoj-link" target="_blank" class="discord-btn-nav"><i class="fa-brands fa-discord"></i> Discord</a>
    </header>
    <section id="home" class="hero">
        <h1>Klan <span>ARMIA MAURYCEGO</span></h1>
        <p>Zgrana ekipa, regularne wojny, maksymalne nagrody z igrzysk i dominacja w Stolicy Klanu.</p>
        <a href="https://discord.gg/twoj-link" target="_blank" class="btn btn-primary"><i class="fa-brands fa-discord"></i> Dołącz na Discorda</a>
    </section>
</body>
</html>
