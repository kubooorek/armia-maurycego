name: Aktualizacja danych klanu

on:
  schedule:
    - cron: "*/15 * * * *"   # co 15 minut (główny wyzwalacz to budzik cron-job.org)
  workflow_dispatch:          # przycisk „Run workflow” / budzik cron-job.org

permissions:
  contents: write

# nigdy dwa uruchomienia naraz (inaczej robot wysłałby coś podwójnie)
concurrency:
  group: aktualizacja-danych
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # zawsze najświeższe dane (po poprzednim uruchomieniu)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pobierz dane z API Clash of Clans
        env:
          COC_TOKEN: ${{ secrets.COC_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_INFO: ${{ secrets.DISCORD_WEBHOOK_INFO }}
          DISCORD_WEBHOOK_RUCHY: ${{ secrets.DISCORD_WEBHOOK_RUCHY }}
          DISCORD_WEBHOOK_WOJNY: ${{ secrets.DISCORD_WEBHOOK_WOJNY }}
          DISCORD_WEBHOOK_RAJDY: ${{ secrets.DISCORD_WEBHOOK_RAJDY }}
          DISCORD_WEBHOOK_POWITANIA: ${{ secrets.DISCORD_WEBHOOK_POWITANIA }}
          DISCORD_WEBHOOK_REKRUTACJA: ${{ secrets.DISCORD_WEBHOOK_REKRUTACJA }}
          DISCORD_WEBHOOK_WYMAGANIA: ${{ secrets.DISCORD_WEBHOOK_WYMAGANIA }}
          DISCORD_WEBHOOK_KARY: ${{ secrets.DISCORD_WEBHOOK_KARY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ROBOT_KEY: ${{ secrets.ROBOT_KEY }}
        run: node scripts/update-data.mjs
      - name: Zapisz zmiany
        run: |
          git config user.name "bot-klanu"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if [ -d img/galeria ]; then git add -A img/galeria; fi
          git diff --cached --quiet || (git commit -m "Aktualizacja danych klanu" && git push)
